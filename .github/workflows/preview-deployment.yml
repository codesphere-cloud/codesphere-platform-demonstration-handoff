name: Codesphere Preview Deployment

# Creates a Codesphere preview workspace from ci.dev.yml for every pull
# request and tears it down when the PR is closed or merged.
#
# Provisioning of the required GitHub secrets/variables and the Codesphere
# shared vault is handled by infrastructure/preview/scaffold.sh — see
# infrastructure/preview/preview.env.example and the "Preview Deployments"
# section of README.md.

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    name: Deploy preview to Codesphere
    # One workspace per PR: queue overlapping runs for the same PR instead of
    # racing two deploys/deletes against the same workspace.
    concurrency: codesphere-preview-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — verify preview deployment preconditions
        env:
          CS_TOKEN: ${{ secrets.CS_TOKEN }}
          CS_TEAM: ${{ vars.CS_TEAM_NAME }}
          CS_VAULT: ${{ vars.CS_SHARED_VAULT }}
          CS_API: ${{ vars.CODESPHERE_INSTANCE_URL || 'https://cloud.codesphere.com' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$CS_TOKEN" ] || fail "CS_TOKEN secret is not set. Run infrastructure/preview/scaffold.sh, or add it under Settings > Secrets and variables > Actions."
          [ -n "$CS_TEAM" ]  || fail "CS_TEAM_NAME variable is not set. Run infrastructure/preview/scaffold.sh, or add it under Settings > Secrets and variables > Actions."
          [ -n "$CS_VAULT" ] || fail "CS_SHARED_VAULT variable is not set. Previews need a team shared vault holding POSTGRES_PASSWORD and POSTGRES_SUPERUSER_PASSWORD (see ci.dev.yml)."
          [ -f ci.dev.yml ]  || fail "ci.dev.yml not found at repo root; the 'dev' CI profile cannot be deployed."

          code=$(curl -s -o teams.json -w '%{http_code}' -H "Authorization: Bearer $CS_TOKEN" "$CS_API/api/teams")
          [ "$code" = "200" ] || fail "Codesphere API rejected CS_TOKEN (HTTP $code) at $CS_API/api/teams. The token is missing, invalid, or expired."

          grep -q "\"name\":\"$CS_TEAM\"" teams.json || fail "Team '$CS_TEAM' not found for this token. Check CS_TEAM_NAME and that the service account is a member of that team."

          echo "Preflight OK: token valid, team '$CS_TEAM' reachable, ci.dev.yml present."

      - name: Deploy preview workspace
        uses: codesphere-cloud/gh-action-deploy@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          apiToken: ${{ secrets.CS_TOKEN }}
          team: ${{ vars.CS_TEAM_NAME }}
          plan: Boost
          onDemand: 'true'
          ciProfile: dev
          deploymentLinkType: preview
          sharedVaultName: ${{ vars.CS_SHARED_VAULT }}
          apiUrl: ${{ vars.CODESPHERE_INSTANCE_URL || 'https://cloud.codesphere.com' }}
